# 商品メタデータ。products/<name>/product.toml にコピーして埋める。
# scripts/package.py と scripts/release_check.py がこのファイルを読む。

[product]
name = "upkg-precheck"
display_name = "出品前チェッカー（unitypackage 検品）"
version = "0.1.0"              # SemVer。出品ごとに上げる
kind = "seller-tool"           # pc-app | blender-addon | seller-tool | other
price_jpy = 500                # 期間限定無料 → ¥500 予定。根拠: docs/market/unitypackage-inspector-2026-09.md
entry = "src/upkg_precheck/__main__.py"
package = "upkg_precheck"

[support]
# VRChat 本体・VR 機器は使わない Windows 用の出品者ツール。
pc_vr = false
desktop = true
quest_standalone = false       # Windows PC 用。README/商品説明に「Quest 単機では動作しません」と明記する
windows_min = "10"
requires = ["Windows 10/11（Unity・VRChat は不要）"]

[deps]
# 実行時に同梱される Python ライブラリと、そのライセンス。他者アセットはここに書かない（同梱禁止）。
# 標準ライブラリのみ。GUID 辞書の出典（lilToon / Modular Avatar / Poiyomi、いずれも MIT）は THIRD_PARTY.md に書く。

[dist]
include = ["README.md", "EULA.md", "CHANGELOG.md", "THIRD_PARTY.md", "src/", "requirements.txt"]
exclude = ["tests/", "docs/", "dist/", "__pycache__/"]
